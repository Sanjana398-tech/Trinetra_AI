{% extends "base.html" %}
{% from "partials/icons.html" import icon %}
{% block content %}
<div class="glass-panel" style="max-width:560px; margin:60px auto; text-align:center;">
  <div class="panel-body" style="padding:56px 40px;">
    <div style="width:64px; height:64px; margin:0 auto 22px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:rgba(255,56,96,0.1); color:var(--danger);">
      {{ icon('alert-circle') }}
    </div>
    <h1>404 — Off the Grid</h1>
    <p>The Third Eye couldn't locate this page. It may have moved, or never existed.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">{{ icon('layout-dashboard') }} Back to Dashboard</a>
  </div>
</div>
{% endblock %}
