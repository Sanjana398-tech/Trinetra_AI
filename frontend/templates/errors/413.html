{% extends "base.html" %}
{% from "partials/icons.html" import icon %}
{% block content %}
<div class="glass-panel" style="max-width:560px; margin:60px auto; text-align:center;">
  <div class="panel-body" style="padding:56px 40px;">
    <div style="width:64px; height:64px; margin:0 auto 22px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:rgba(255,176,32,0.12); color:var(--warn);">
      {{ icon('alert-triangle') }}
    </div>
    <h1>413 — File Too Large</h1>
    <p>That upload exceeds the size limit this installation allows. Try a smaller file.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">{{ icon('layout-dashboard') }} Back to Dashboard</a>
  </div>
</div>
{% endblock %}
